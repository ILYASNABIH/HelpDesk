<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk</title>
		<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<header>
		<img src="assets/images/better logo.png" class="img-HD">
		<nav class="nav-bar">
			<ul class="liens list-ul">
				<li><a href="#" class="liens lien1">Atlas Solutions</a></li>
				<li><p class="liens lien2">/</p></li>
				<li><a href="#" class="liens lien3">Support</a></li>
			</ul>
		</nav>
	</header>
<main>
<section class="reclamation">
	<div class="demande-txt">
		<h1>Gestion des demandes</h1>
		<p>Centralisez les incidents et simplifiez le suivi de votre équipe.</p>
	</div>
	<div class="demande-admit">
		<div>
		<h2>Créer une demande</h2>
		<p>Décrivez votre problème informatique en quelques étapes.</p>
	</div>
	<div>
		<form>
			<div class="reclam">
				<div class="inputs input1">
					<label for="problème">Titre du problème *</label>
					<input
					type="text"
					placeholder="Connexion Wi-Fi instable"
					id="problème"
					name="problème"
					required
					class="prob"
					>
				</div>
				<div class="inputs input2">
					<label for="categorie">Catégorie *</label>
					<select id="categorie" name="Catégorie" class="sel-cat" required>
						<option value="Catégorie 1">Catégorie 1</option>
						<option value="Catégorie 2">Catégorie 2</option>
						<option value="Categorie 3">Catégorie 3</option> 
					</select>
				</div>
				<div class="inputs input3">
					<label for="priorite">Priorité *</label>
					<select id="priorite" name="Priorité" class="sel-pro" required>
						<option value="Priorité 1">Priorité 1</option>
						<option value="Priorité 2">Priorité 2</option>
						<option value="Priorité 3">Priorité 3</option> 
					</select>
				</div>
				<div class="inputs input4">
					<label for="description">Description *</label>
					<textarea
					type="text"
					placeholder="Décrivez le problème informatique rencontré..."
					id="description"
					name="Description"
					required
					class="desc"
					rows="4"
					></textarea>
				</div>
			</div>
			<div class="botona">
			<button type="submit" class="ajt-btn">＋  Ajouter la demande</button>
			</div>
		</form>
	</div>
</section>
</main>
</body>
</html>
